{% extends 'base.html' %}
{% block content %}

<div class="row">

{% for p in products %}
<div class="col-3">
    <div class="card p-2">

        <img src="{{ p.image }}"
             class="product-img"
             onclick="openImage(this.src)"
             style="width:100%; height:200px; object-fit:cover;">

        <h5>{{ p.name }}</h5>
        <p>₹{{ p.price }}</p>

        <a href="/add/{{ p.id }}" class="btn btn-success">Add</a>
    </div>
</div>
{% endfor %}

</div>

<!-- 🔍 FULL SCREEN IMAGE POPUP -->
<div id="imgPopup" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
text-align:center;
z-index:2000;
">

    <img id="popupImg" style="max-width:90%; max-height:90%; margin-top:50px;">

    <br>
    <button onclick="closeImage()" class="btn btn-light mt-3">Close</button>
</div>

<script>
function openImage(src) {
    document.getElementById("imgPopup").style.display = "block";
    document.getElementById("popupImg").src = src;
}

function closeImage() {
    document.getElementById("imgPopup").style.display = "none";
}
</script>

{% endblock %}
