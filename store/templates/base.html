<!DOCTYPE html>
<html>
<head>
    <title>ElectroMart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 🔥 ZOOM EFFECT */
.product-img {
    transition: transform 0.4s ease;
    cursor: zoom-in;
}

.product-img:hover {
    transform: scale(1.5);   /* zoom level */
    z-index: 10;
}
        body {
            margin: 0;
            padding: 0;

            /* Background Image */
            background: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c') no-repeat center center fixed;
            background-size: cover;

            color: white;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: -1;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.8);
        }

        .navbar a, .navbar span {
            color: white !important;
        }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: none;
            color: white;
        }

        .card:hover {
            transform: scale(1.05);
            transition: 0.3s;
            box-shadow: 0 0 15px cyan;
        }

        img {
            border-radius: 10px;
        }

        /* Content box */
        .content-box {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<!-- 🔥 NAVBAR -->
<nav class="navbar navbar-expand-lg p-3">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="/">🛒 ElectroMart</a>

        <!-- Search -->
        <form class="d-flex w-50" method="get" action="/search/">
            <input class="form-control me-2" type="search" name="q" placeholder="Search products...">
            <button class="btn btn-warning">Search</button>
        </form>

        <div>
            {% if user.is_authenticated %}
                <span>👤 {{ user.username }}</span>

                <form action="/logout/" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button class="btn btn-danger btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="/login/" class="btn btn-light btn-sm">Login</a>
                <a href="/register/" class="btn btn-success btn-sm">Register</a>
            {% endif %}

            <a href="/cart/" class="btn btn-warning btn-sm ms-2">🛒 Cart</a>
        </div>

    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
    <div class="content-box">
        {% block content %}{% endblock %}
    </div>
</div>

<!-- 🤖 CHATBOT BUTTON -->
<button onclick="toggleChat()" style="
position:fixed;
bottom:20px;
right:20px;
background:#2874f0;
color:white;
border:none;
padding:15px;
border-radius:50%;
font-size:20px;
z-index:1000;
">
💬
</button>

<!-- 🤖 CHATBOX -->
<div id="chatbox" style="
display:none;
position:fixed;
bottom:80px;
right:20px;
width:300px;
background:white;
color:black;
border-radius:10px;
box-shadow:0 0 10px gray;
padding:10px;
z-index:1000;
">

    <h5>🤖 ElectroMart Bot</h5>

    <div id="chatContent" style="height:200px; overflow:auto; border:1px solid #ccc; padding:5px; margin-bottom:5px;">
    </div>

    <input type="text" id="userInput" class="form-control" placeholder="Ask something...">

    <button onclick="sendMessage()" class="btn btn-primary btn-sm mt-2 w-100">
        Send
    </button>

</div>

<!-- 🤖 SCRIPT -->
<script>
function toggleChat() {
    let box = document.getElementById("chatbox");
    box.style.display = (box.style.display === "none") ? "block" : "none";
}

function sendMessage() {
    let input = document.getElementById("userInput").value;
    let chat = document.getElementById("chatContent");

    if(input.trim() === "") return;

    chat.innerHTML += "<p><b>You:</b> " + input + "</p>";

    let reply = "";
    input = input.toLowerCase();

    if(input.includes("order")) {
        reply = "📦 Your order will be delivered soon!";
    }
    else if(input.includes("product")) {
        reply = "🛒 Browse products on the home page.";
    }
    else if(input.includes("price")) {
        reply = "💰 Prices are shown on each product.";
    }
    else if(input.includes("cart")) {
        reply = "🛒 Click on cart to view items.";
    }
    else if(input.includes("hello") || input.includes("hi")) {
        reply = "👋 Hello! How can I help you?";
    }
    else {
        reply = "🤖 Sorry, I didn’t understand.";
    }

    chat.innerHTML += "<p><b>Bot:</b> " + reply + "</p>";

    document.getElementById("userInput").value = "";
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
